# FreeRADIUS Client Configuration for XCLOUD.NET MikroTik NAS Routers

client mikrotik_nas_default {
    ipaddr = 0.0.0.0/0
    secret = xcloud_freeradius_shared_secret_mikrotik_nas_2026
    require_message_authenticator = no
    nas_type = other
    limit {
        max_connections = 1000
        lifetime = 0
        idle_timeout = 30
    }
}

client localhost {
    ipaddr = 127.0.0.1
    secret = xcloud_freeradius_shared_secret_mikrotik_nas_2026
    require_message_authenticator = no
}
