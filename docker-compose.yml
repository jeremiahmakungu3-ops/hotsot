version: '3.8'

services:
  # -------------------------------------------------------------
  # Reverse Proxy & SSL Termination
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: xcloud_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - xcloud_network

  # -------------------------------------------------------------
  # XCLOUD.NET Application Server (Node/Express API + Vite SPA)
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xcloud_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://xcloud_user:${DB_PASSWORD:-xcloud_secure_pass_2026}@postgres:5432/xcloud_db?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-xcloud_redis_pass_2026}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-xcloud_production_jwt_master_secret_key_32_bytes}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-xcloud_production_jwt_refresh_secret_key_32_bytes}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      - RADIUS_SECRET=${RADIUS_SECRET:-xcloud_freeradius_shared_secret_mikrotik_nas_2026}
      - MIKROTIK_API_TIMEOUT=10000
      - PAYMENT_PROVIDER=SELCOM
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xcloud_network

  # -------------------------------------------------------------
  # PostgreSQL Database Engine
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: xcloud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xcloud_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xcloud_secure_pass_2026}
      POSTGRES_DB: xcloud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xcloud_user -d xcloud_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xcloud_network

  # -------------------------------------------------------------
  # Redis Cache & BullMQ Queue Broker
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: xcloud_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-xcloud_redis_pass_2026}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-xcloud_redis_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - xcloud_network

  # -------------------------------------------------------------
  # FreeRADIUS 3 Authentication & Accounting Server
  # -------------------------------------------------------------
  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: xcloud_freeradius
    restart: unless-stopped
    ports:
      - "1812:1812/udp" # Auth
      - "1813:1813/udp" # Accounting
      - "3799:3799/udp" # CoA / Disconnect-Request
    volumes:
      - ./radius/radiusd.conf:/etc/raddb/radiusd.conf:ro
      - ./radius/clients.conf:/etc/raddb/clients.conf:ro
      - ./radius/dictionary.mikrotik:/usr/share/freeradius/dictionary.mikrotik:ro
    depends_on:
      - postgres
      - app
    networks:
      - xcloud_network

volumes:
  postgres_data:
  redis_data:

networks:
  xcloud_network:
    driver: bridge
